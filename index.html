<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regional Org Charts — RVP View</title>
<style>
  :root{
    --rvp:#1f3a5f; --l2:#2e7d9a; --l3:#5a9e6f; --bg:#f4f6f9;
    --line:#b9c2cd; --ink:#1c2733; --muted:#67727e; --panel:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--rvp);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.3px;}
  header .src{font-size:12px;color:#c5d3e3;}
  .controls{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
  .ctl label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#c5d3e3;margin-bottom:4px;}
  select{font-size:15px;padding:7px 10px;border-radius:6px;border:1px solid #cbd5e1;min-width:220px;}
  .layout{display:flex;align-items:stretch;min-height:calc(100vh - 60px);}
  .filters{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto;}
  .filters h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px;}
  .filters h3:first-child{margin-top:0;}
  .fgroup{font-size:13px;}
  .fgroup .row{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;}
  .fgroup .row input{cursor:pointer;}
  .fgroup .count{margin-left:auto;color:var(--muted);font-size:11px;}
  .fbtns{display:flex;gap:6px;margin:6px 0 2px;}
  .fbtns button{font-size:11px;padding:3px 8px;border:1px solid #cbd5e1;background:#fff;border-radius:5px;cursor:pointer;}
  .fbtns button:hover{background:#eef2f7;}
  .chart{flex:1;overflow:auto;padding:28px 24px;}
  .sidebar{width:330px;flex:none;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;}
  .sidebar h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 4px;}
  .sidebar .hint{font-size:11px;color:var(--muted);margin-bottom:12px;}

  /* chart nodes */
  .tree{display:flex;flex-direction:column;align-items:center;min-width:max-content;}
  .node{border-radius:9px;color:#fff;padding:9px 14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.18);max-width:230px;}
  .node .nm{font-weight:600;font-size:14px;line-height:1.2;}
  .node .tt{font-size:11.5px;opacity:.92;margin-top:2px;line-height:1.25;}
  .node .loc{font-size:10px;opacity:.8;margin-top:3px;}
  .rvp{background:var(--rvp);}
  .l2{background:var(--l2);}
  .l3{background:var(--l3);color:#fff;padding:7px 11px;max-width:200px;}
  .l3 .nm{font-size:12.5px;} .l3 .tt{font-size:10.5px;}

  .vline{width:2px;height:22px;background:var(--line);}
  .row2{display:flex;align-items:flex-start;gap:26px;justify-content:center;}
  .branch{display:flex;flex-direction:column;align-items:center;}
  .l3wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px;}
  .l3wrap.empty{display:none;}
  .l3count{font-size:10px;color:var(--muted);margin-top:6px;}
  .hconn{height:2px;background:var(--line);}
  .topconn{display:flex;justify-content:center;}

  /* sidebar chain */
  .chain{font-size:13px;}
  .chain .lvl1{margin:10px 0 4px;font-weight:700;color:var(--rvp);}
  .chain .lvl2{margin:8px 0 2px 4px;font-weight:600;color:var(--l2);border-left:3px solid var(--l2);padding-left:8px;}
  .chain .lvl3{margin:1px 0 1px 22px;color:var(--ink);padding-left:8px;border-left:2px solid #d4dde6;}
  .chain .t{color:var(--muted);font-size:11px;}
  .chain .badge{display:inline-block;background:#eef2f7;color:var(--muted);font-size:10px;border-radius:4px;padding:0 5px;margin-left:4px;}
  .summary{font-size:12px;color:var(--muted);background:#f7f9fb;border:1px solid #e6ecf2;border-radius:6px;padding:8px 10px;margin-bottom:12px;}
  .empty-msg{color:var(--muted);font-style:italic;padding:20px;}
  @media print{.filters,.sidebar,header .controls{display:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Regional Org Charts</h1>
    <div class="src">RVP-level view · active employees</div>
  </div>
  <div class="controls">
    <div class="ctl">
      <label for="region">Region (RVP)</label>
      <select id="region"></select>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="filters">
    <h3>Direct Reports (Level 2)</h3>
    <div class="fbtns"><button data-lvl="2" data-act="all">All</button><button data-lvl="2" data-act="none">None</button></div>
    <div class="fgroup" id="filter2"></div>

    <h3>Their Reports (Level 3)</h3>
    <div class="fbtns"><button data-lvl="3" data-act="all">All</button><button data-lvl="3" data-act="none">None</button></div>
    <div class="fgroup" id="filter3"></div>
  </aside>

  <main class="chart" id="chart"></main>

  <aside class="sidebar">
    <h3>Chain of Command</h3>
    <div class="hint">Names & titles currently shown, in reporting order.</div>
    <div class="summary" id="summary"></div>
    <div class="chain" id="chain"></div>
  </aside>
</div>

const DATA = JSON.parse(document.getElementById('data').textContent);
const regionSel = document.getElementById('region');
const state = { region:null, show2:new Set(), show3:new Set() };

// populate regions
Object.keys(DATA.regions).forEach(r=>{
  const o=document.createElement('option'); o.value=r;
  const rvp=DATA.regions[r];
  o.textContent = `${r} — ${rvp.name}`;
  regionSel.appendChild(o);
});

function groupCounts(region){
  const rvp=DATA.regions[region];
  const c2={}, c3={};
  rvp.reports.forEach(d=>{
    c2[d.group]=(c2[d.group]||0)+1;
    (d.reports||[]).forEach(s=>{ c3[s.group]=(c3[s.group]||0)+1; });
  });
  return {c2,c3};
}

function buildFilters(region){
  const {c2,c3}=groupCounts(region);
  // sensible defaults: level2 -> leadership roles on; level3 -> practice admin focus on
  const def2on = g => /Director|Practice Administrator|Manager|Supervisor/.test(g);
  const def3on = g => /Practice Administrator|Director|Manager|Supervisor/.test(g);
  function render(containerId, counts, defOn, target){
    const el=document.getElementById(containerId); el.innerHTML='';
    target.clear();
    Object.keys(counts).sort().forEach(g=>{
      if(defOn(g)) target.add(g);
      const row=document.createElement('label'); row.className='row';
      const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=target.has(g); cb.value=g;
      cb.addEventListener('change',()=>{ cb.checked?target.add(g):target.delete(g); draw(); });
      const span=document.createElement('span'); span.textContent=g;
      const cnt=document.createElement('span'); cnt.className='count'; cnt.textContent=counts[g];
      row.append(cb,span,cnt); el.appendChild(row);
    });
  }
  render('filter2',c2,def2on,state.show2);
  render('filter3',c3,def3on,state.show3);
}

document.querySelectorAll('.fbtns button').forEach(b=>{
  b.addEventListener('click',()=>{
    const lvl=b.dataset.lvl, act=b.dataset.act;
    const target=lvl==='2'?state.show2:state.show3;
    const counts=groupCounts(state.region)[lvl==='2'?'c2':'c3'];
    target.clear();
    if(act==='all') Object.keys(counts).forEach(g=>target.add(g));
    document.querySelectorAll('#filter'+lvl+' input').forEach(cb=>cb.checked=target.has(cb.value));
    draw();
  });
});

function nodeEl(p, cls){
  const d=document.createElement('div'); d.className='node '+cls;
  d.innerHTML=`<div class="nm">${esc(p.name)}</div><div class="tt">${esc(p.title||'')}</div>`+
    (p.city?`<div class="loc">${esc(p.city)}${p.state?', '+esc(p.state):''}</div>`:'');
  return d;
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function draw(){
  const region=state.region; const rvp=DATA.regions[region];
  const chart=document.getElementById('chart'); chart.innerHTML='';
  const tree=document.createElement('div'); tree.className='tree';
  tree.appendChild(nodeEl(rvp,'rvp'));

  const directs=rvp.reports.filter(d=>state.show2.has(d.group));
  if(directs.length){
    const v=document.createElement('div'); v.className='vline'; tree.appendChild(v);
    const row=document.createElement('div'); row.className='row2';
    directs.forEach(d=>{
      const branch=document.createElement('div'); branch.className='branch';
      branch.appendChild(nodeEl(d,'l2'));
      const subs=(d.reports||[]).filter(s=>state.show3.has(s.group));
      if(subs.length){
        const v2=document.createElement('div'); v2.className='vline'; branch.appendChild(v2);
        const wrap=document.createElement('div'); wrap.className='l3wrap';
        subs.forEach(s=>wrap.appendChild(nodeEl(s,'l3')));
        branch.appendChild(wrap);
      }
      const hidden=(d.reports||[]).length-subs.length;
      if(hidden>0){const c=document.createElement('div');c.className='l3count';c.textContent=`+${hidden} hidden`;branch.appendChild(c);}
      row.appendChild(branch);
    });
    tree.appendChild(row);
  } else {
    const m=document.createElement('div'); m.className='empty-msg'; m.textContent='No direct-report roles selected.'; tree.appendChild(m);
  }
  chart.appendChild(tree);
  drawChain(rvp,directs);
}

function drawChain(rvp,directs){
  const chain=document.getElementById('chain'); chain.innerHTML='';
  let n2=0,n3=0;
  const top=document.createElement('div'); top.className='lvl1';
  top.innerHTML=`${esc(rvp.name)} <span class="t">— ${esc(rvp.title)}</span>`;
  chain.appendChild(top);
  directs.forEach(d=>{
    n2++;
    const a=document.createElement('div'); a.className='lvl2';
    a.innerHTML=`${esc(d.name)} <span class="t">— ${esc(d.title)}</span>`;
    chain.appendChild(a);
    (d.reports||[]).filter(s=>state.show3.has(s.group)).forEach(s=>{
      n3++;
      const b=document.createElement('div'); b.className='lvl3';
      b.innerHTML=`${esc(s.name)} <span class="t">— ${esc(s.title)}</span>`;
      chain.appendChild(b);
    });
  });
  document.getElementById('summary').innerHTML =
    `<b>${esc(state.region)}</b> region<br>${n2} direct report${n2!==1?'s':''} shown · ${n3} second-level shown · ${n2+n3+1} total`;
}

regionSel.addEventListener('change',()=>{ state.region=regionSel.value; buildFilters(state.region); draw(); });

// init
state.region=regionSel.value=Object.keys(DATA.regions)[0];
buildFilters(state.region);
draw();
</script>
</body>
</html>
